<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Iris AI Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

    body {
        background: #f5f7fa;
        color: #111;
    }

    .container {
        max-width: 1000px;
        margin: 80px auto 20px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        display: flex;
        overflow: hidden;
    }

    .left {
        flex: 1;
        background: #eef2ff;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px;
    }

    .left img {
        width: 260px;
        border-radius: 12px;
    }

    .right {
        flex: 1;
        padding: 50px;
    }

    h1 {
        font-size: 28px;
        margin-bottom: 10px;
    }

    p {
        color: #666;
        margin-bottom: 30px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 8px;
        border: 1px solid #ddd;
        font-size: 14px;
    }

    input:focus {
        outline: none;
        border-color: #4f46e5;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #4f46e5;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #4338ca;
    }

    .result {
        margin-top: 20px;
        padding: 12px;
        border-radius: 8px;
        background: #eef2ff;
        font-weight: 600;
        text-align: center;
    }

    footer {
        text-align: center;
        color: #777;
        font-size: 14px;
        margin-bottom: 30px;
    }
</style>

</head>
<body>

<div class="container">
    <div class="left">
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/Iris_versicolor_3.jpg" alt="Iris Flower">
    </div>

<div class="right">
    <h1>Iris Flower Predictor</h1>
    <p>Enter the measurements to predict the flower species using a trained machine learning model.</p>

    <form action="/predict" method="post">
        <input type="number" step="0.1" name="sepal_length" placeholder="Sepal Length (cm)" required>
        <input type="number" step="0.1" name="sepal_width" placeholder="Sepal Width (cm)" required>
        <input type="number" step="0.1" name="petal_length" placeholder="Petal Length (cm)" required>
        <input type="number" step="0.1" name="petal_width" placeholder="Petal Width (cm)" required>
        <button type="submit">Predict Species</button>
    </form>

    {% if prediction %}
        <div class="result">
            Prediction: {{ prediction }}
        </div>
    {% endif %}
</div>
</div>

<footer>
    Built by <strong>Shivam Gupta</strong> • Machine Learning Project
</footer>

</body>
</html>
